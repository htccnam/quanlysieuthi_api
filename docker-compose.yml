name: quanlysieuthi_server

services:
  api-server:
    build: .
    container_name: spring_boot_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=QuanLySieuThiAPI
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/quanlysieuthi?useUnicode=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root123
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      - JWT_SECRET_KEY=eZwRBl4mPxrwhHPpYlwZrc1refIEeuiCzVR4anVBj2iXKadxwNtO7tKWFVTc7Epn
      - JAVA_OPTS=-Xmx350m
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 300M

  database:
    image: mysql:8.0
    container_name: mysql_quanlysieuthi
    restart: always
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=quanlysieuthi
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  mysql_data:
